name: Unzip and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Unzip and Gradle
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip gradle

    - name: Unzip Files
      run: |
        unzip -o *.zip || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK
      run: |
        # अगर gradlew है तो उससे बिल्ड करेगा, नहीं तो सिस्टम Gradle यूज़ करेगा
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          # प्रोजेक्ट के फ़ोल्डर में जाकर बिल्ड करेगा
          BUILD_DIR=$(find . -maxdepth 3 -name "build.gradle*" -exec dirname {} \; | head -n 1)
          cd "$BUILD_DIR"
          gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Orbital-VPN-App
        path: "**/build/outputs/apk/debug/*.apk"
