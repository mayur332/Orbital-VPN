name: Build and Upload APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip gradle

    - name: Unzip Project Files
      run: |
        unzip -o *.zip || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK
      run: |
        # settings.gradle वाले फोल्डर को खोजकर उसमे जाकर बिल्ड करो
        TARGET_DIR=$(find . -name "settings.gradle*" -exec dirname {} \; | head -n 1)
        if [ -z "$TARGET_DIR" ]; then
          TARGET_DIR=$(find . -name "build.gradle*" -exec dirname {} \; | head -n 1)
        fi
        
        cd "$TARGET_DIR"
        gradle assembleDebug --warning-mode none

    - name: Upload APK File
      uses: actions/upload-artifact@v4
      with:
        name: Orbital-VPN-App
        path: "**/*.apk"
