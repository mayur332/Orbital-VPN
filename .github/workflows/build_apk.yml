name: Unzip and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Unzip
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip

    - name: Unzip Files
      run: |
        unzip -o *.zip || true

    - name: Find and Move Gradlew to Root
      run: |
        # अगर gradlew किसी अंदर वाले फोल्डर में है तो उसे बाहर लाएगा
        GRADLE_DIR=$(find . -maxdepth 3 -name "gradlew" -exec dirname {} \;)
        if [ -n "$GRADLE_DIR" ] && [ "$GRADLE_DIR" != "." ]; then
          echo "Found project in $GRADLE_DIR. Copying files to root..."
          cp -r $GRADLE_DIR/* .
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Orbital-VPN-App
        path: "**/build/outputs/apk/debug/*.apk"
