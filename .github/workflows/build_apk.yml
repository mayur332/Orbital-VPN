name: Unzip and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Unzip and Gradle
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip gradle

    - name: Unzip Files and Extract Project
      run: |
        unzip -o *.zip || true
        # अगर Android प्रोजेक्ट किसी सब-फ़ोल्डर में है, तो उसे बाहर निकालो
        INNER_DIR=$(find . -mindepth 2 -name "settings.gradle*" -exec dirname {} \;)
        if [ -n "$INNER_DIR" ]; then
          echo "Found project inside $INNER_DIR. Moving files to root..."
          cp -rn $INNER_DIR/* .
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Orbital-VPN-App
        path: "**/build/outputs/apk/debug/*.apk"
