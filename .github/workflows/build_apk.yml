name: Unzip and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Unzip and Gradle
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip gradle

    - name: Unzip Files
      run: |
        unzip -o *.zip || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK (Smart Search)
      run: |
        # settings.gradle वाली लोकेशन ढूंढो
        TARGET_DIR=$(find . -name "settings.gradle*" -exec dirname {} \; | head -n 1)
        
        if [ -z "$TARGET_DIR" ]; then
          # अगर settings.gradle नहीं मिली तो build.gradle ढूंढो
          TARGET_DIR=$(find . -name "build.gradle*" -exec dirname {} \; | head -n 1)
        fi

        echo "Project found at: $TARGET_DIR"
        cd "$TARGET_DIR"

        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Orbital-VPN-App
        path: "**/build/outputs/apk/debug/*.apk"
