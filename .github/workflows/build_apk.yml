name: Debug Files and Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Unzip and Gradle
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip gradle tree

    - name: Unzip Files
      run: |
        unzip -o *.zip || true

    - name: List All Files
      run: |
        echo "=== ALL FILES IN REPO ==="
        ls -la
        echo "=== FINDING GRADLE BUILD FILES ==="
        find . -maxdepth 3 -name "*gradle*"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Try Build Any Subfolder
      run: |
        # जहाँ भी build.gradle या build.gradle.kts दिखेगा उस हर फ़ोल्डर में जाकर बिल्ड की कोशिश करेगा
        for dir in $(find . -name "build.gradle*" -exec dirname {} \;); do
          echo "Attempting build in: $dir"
          (cd "$dir" && gradle tasks --all || true)
          (cd "$dir" && gradle assemble || true)
        done
