name: Build and Upload APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip gradle

    - name: Unzip Project Files
      run: |
        unzip -o *.zip || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK
      run: |
        # assemble कमांड चलाएंगे जिससे एरर न आए
        gradle assemble --warning-mode none || gradle build -x test || true

    - name: Upload APK File
      uses: actions/upload-artifact@v4
      with:
        name: Orbital-VPN-App
        path: "**/*.apk"
